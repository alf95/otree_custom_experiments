{{ extends "global/Page.html" }}
{{ block title }}
    Ritorno al Futuro - Public Goods Game
{{ endblock }}

{{ block content }}

<style>
:root{--bg:#05080a;--panel:#0a1216;--panel2:#0d191f;--line:#143c3c;--green:#39ff14;--cyan:#00e5ff;--orange:#ff9f1c;--red:#ff3b3b;--text:#cdf5cc;--dim:#7fa393}
body{background:var(--bg)!important;color:var(--text);font-family:"Courier New",Courier,monospace}
.otree-body{max-width:860px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 0 14px rgba(57,255,20,.1),inset 0 0 22px rgba(0,0,0,.55);color:var(--text)}
.card-header,.card-title,h1,h2,h3,h4,h5,h6{color:var(--green);text-shadow:0 0 8px rgba(57,255,20,.55);letter-spacing:.5px}
.table{color:var(--text);--bs-table-bg:transparent;--bs-table-striped-bg:rgba(57,255,20,.05);border-color:var(--line)}
.table thead th{color:var(--cyan);border-color:var(--line);text-shadow:0 0 6px rgba(0,229,255,.5)}
.table td{border-color:var(--line)}
.otree-btn-next{background:var(--green)!important;color:#031803!important;border:none!important;font-weight:bold;letter-spacing:1px;text-shadow:none;box-shadow:0 0 12px rgba(57,255,20,.55)}
.otree-btn-next:hover{background:var(--cyan)!important;color:#001418!important;box-shadow:0 0 16px rgba(0,229,255,.8)}
.form-range::-webkit-slider-runnable-track{background:#0e211c;border:1px solid var(--line)}
.form-range::-webkit-slider-thumb{background:var(--orange);border:2px solid #6b3b00;box-shadow:0 0 10px rgba(255,159,28,.9)}
.form-range::-moz-range-track{background:#0e211c;border:1px solid var(--line)}
.form-range::-moz-range-thumb{background:var(--orange);border:2px solid #6b3b00;box-shadow:0 0 10px rgba(255,159,28,.9)}
.retro-header{color:var(--cyan);letter-spacing:2px;font-size:1.05rem;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:22px;text-shadow:0 0 6px rgba(0,229,255,.6)}
.retro-screen{background:#030d08;border:1px solid var(--line);box-shadow:inset 0 0 22px rgba(0,0,0,.85);color:var(--green);text-shadow:0 0 8px rgba(57,255,20,.85);letter-spacing:3px;border-radius:6px}
.retro-label{color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;font-size:.75rem}
.retro-value{color:var(--orange);font-weight:bold;text-shadow:0 0 6px rgba(255,159,28,.6)}
.retro-big{color:var(--cyan);font-size:1.5rem;text-shadow:0 0 8px rgba(0,229,255,.7)}
.retro-success{background:rgba(57,255,20,.1);border:1px solid var(--green);color:var(--green);text-shadow:0 0 8px rgba(57,255,20,.8);padding:16px;border-radius:6px;font-size:1.25rem;letter-spacing:1px}
.retro-danger{background:rgba(255,59,59,.1);border:1px solid var(--red);color:var(--red);text-shadow:0 0 8px rgba(255,59,59,.8);padding:16px;border-radius:6px;font-size:1.25rem;letter-spacing:1px}
.retro-lang-option{color:var(--text);font-size:1.1rem;cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.retro-lang-option:hover{border-color:var(--green)}
.retro-btn{background:var(--panel2);color:var(--cyan);border:1px solid var(--line)}
.retro-btn:hover{border-color:var(--cyan);color:var(--green)}
.alert-info{background:rgba(0,229,255,.08);color:var(--text);border-color:var(--line)}
a{color:var(--cyan)}
</style>

<div class="retro-header">:: FLUX CAPACITOR ONLINE - 1985 ::</div>

<div class="card mb-4">
    <div class="card-body text-center py-4">
        <h4 class="mb-2">Scegli la lingua - Choose your language</h4>

        <div class="d-flex justify-content-center gap-3 flex-wrap mb-4">
            <label class="retro-lang-option">
                <input type="radio" name="lang" value="it" {{ lang_checked_it }} class="me-2">
                [ IT ] Italiano
            </label>
            <label class="retro-lang-option">
                <input type="radio" name="lang" value="en" {{ lang_checked_en }} class="me-2">
                [ EN ] English
            </label>
        </div>

        {{ formfield_errors 'lang' }}
    </div>
</div>

<div class="mt-4">
    <button type="submit" class="otree-btn-next btn btn-primary btn-lg px-5">{{ button_label }}</button>
</div>

{{ endblock }}
